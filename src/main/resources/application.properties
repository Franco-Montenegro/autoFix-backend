spring.application.name=backend

server.port=${SERVER_PORT:8090}

# Datasource: credenciales solo por variables de entorno
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/dbautofix
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El esquema se gestiona por perfil (ver application-local.properties)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# CORS: origenes del frontend separados por coma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Calculo de costo: IVA como fraccion (0.19 = 19%)
app.cost.tax-rate=${TAX_RATE:0.19}

# Seguridad: la API valida tokens JWT emitidos por el realm de Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/autofix}
