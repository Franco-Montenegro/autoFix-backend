# Pipeline del backend (Fase 11.2): pruebas + cobertura y, si pasan, imagen en Docker Hub.
# Secrets requeridos en el repo: DOCKERHUB_USERNAME y DOCKERHUB_TOKEN (access token, no la contrasena).
name: CI backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Desde Windows el wrapper suele quedar sin bit de ejecucion
      - name: Permiso de ejecucion para mvnw
        run: chmod +x mvnw

      # Pruebas unitarias + regla de JaCoCo; si falla, no se publica la imagen
      - name: Pruebas y cobertura
        run: ./mvnw -B verify

      - name: Tag con SHA corto
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/autofix-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/autofix-backend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
