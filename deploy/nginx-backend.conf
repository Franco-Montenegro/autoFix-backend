# Balanceador interno del backend: reparte /api/ entre las 3 replicas (round robin).
events { worker_connections 1024; }

http {
    # $upstream_addr muestra que replica atendio cada peticion (evidencia del balanceo)
    log_format balance '$remote_addr [$time_local] "$request" $status -> $upstream_addr ($upstream_response_time s)';
    access_log /dev/stdout balance;

    # DNS interno de Docker: si una replica se recrea y cambia de IP, se vuelve a resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend_servers {
        zone backend_servers 64k;
        server backend1:8090 resolve;
        server backend2:8090 resolve;
        server backend3:8090 resolve;
    }

    server {
        listen 8090;

        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
