# Entrada publica para probar en el PC: igual a nginx-frontend.conf pero solo HTTP, sin certificado.
# Sirve con AUTOFIX_PUBLIC_URL=http://localhost: localhost es contexto seguro, asi PKCE funciona sin HTTPS.
events { worker_connections 1024; }

http {
    # $upstream_addr muestra que replica atendio cada peticion (evidencia del balanceo)
    log_format balance '$remote_addr [$time_local] "$request" $status -> $upstream_addr ($upstream_response_time s)';
    access_log /dev/stdout balance;

    # DNS interno de Docker: si un contenedor se recrea y cambia de IP, se vuelve a resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream frontend_servers {
        zone frontend_servers 64k;
        server frontend1:80 resolve;
        server frontend2:80 resolve;
        server frontend3:80 resolve;
    }

    upstream backend_gateway {
        zone backend_gateway 64k;
        server nginx-backend:8090 resolve;
    }

    upstream keycloak_server {
        zone keycloak_server 64k;
        server keycloak:8080 resolve;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # API -> balanceador del backend (conserva el prefijo /api/)
        location /api/ {
            proxy_pass http://backend_gateway;
        }

        # Keycloak (KC_HTTP_RELATIVE_PATH=/auth). Sus respuestas traen cabeceras grandes
        location /auth/ {
            proxy_pass http://keycloak_server;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # SPA -> 3 replicas del frontend
        location / {
            proxy_pass http://frontend_servers;
        }
    }
}
